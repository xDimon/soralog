name: OS and Compilers

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
        compiler: [{
          "cc": "gcc",
          "cxx": "g++"
         }, {
          "cc": "clang",
          "cxx": "clang++"
         }]
        exclude:
          - os: macOS-latest
            compiler:
              cc: gcc
    steps:
    - name: checkout
      uses: actions/checkout@v1
      with:
        submodules: true
        clean: true
        fetch-depth: 1

    - name: venv
      run: python3 -m venv --upgrade-deps ~/venv && .github/scripts/github_venv.sh $_

    - name: install dependencies
      run: |
        set -e

        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install ninja
          sudo xcode-select --switch /Library/Developer/CommandLineTools
        else
          sudo apt-get update || true
          sudo apt-get install -y ninja-build gcovr gcc-13 g++-13 clang-18 clang++-18 clang-tidy-18 clang-format-18

          sudo update-alternatives --install /usr/bin/python       python       /usr/bin/python3               90
          sudo update-alternatives --install /usr/bin/clang-tidy   clang-tidy   /usr/bin/clang-tidy-18         999 
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18       999 
          sudo update-alternatives --install /usr/bin/clang        clang        /usr/lib/llvm-18/bin/clang-18  999
          sudo update-alternatives --install /usr/bin/clang++      clang++      /usr/bin/clang++-18            999
          sudo update-alternatives --install /usr/bin/gcc          gcc          /usr/bin/gcc-13                90
          sudo update-alternatives --install /usr/bin/g++          g++          /usr/bin/g++-13                90
          sudo update-alternatives --install /usr/bin/gcov         gcov         /usr/bin/gcov-13               90
        fi

        pip3 install scikit-build
        pip3 install cmake==3.25 requests gitpython gcovr pyyaml

    - name: cmake
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: cmake . -Bbuild -DBUILD_TESTS=ON -DEXAMPLES=ON

    - name: build
      run: cmake --build build -- -j4

    - name: test
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
      run: cmake --build build --target test

  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shared: ['OFF', 'ON']
        config: [Release, Debug]
    name: windows-msvc (shared ${{ matrix.shared }}, ${{ matrix.config }})
    env:
      # Short path for Hunter's builds of dependencies
      HUNTER_ROOT: C:\.hunter
    steps:
    - name: checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: cmake
      run: cmake -S . -B build -DBUILD_TESTS=ON -DEXAMPLES=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }}

    - name: build
      run: cmake --build build --config ${{ matrix.config }} --parallel 4

    - name: test
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  windows-mingw:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shared: ['OFF', 'ON']
    name: windows-mingw (shared ${{ matrix.shared }})
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-fmt
          mingw-w64-ucrt-x86_64-yaml-cpp
          mingw-w64-ucrt-x86_64-gtest

    - name: cmake
      run: cmake -S . -B build -G Ninja -DPACKAGE_MANAGER=none -DBUILD_TESTS=ON -DEXAMPLES=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }}

    - name: build
      run: cmake --build build --parallel 4

    - name: test
      run: ctest --test-dir build --output-on-failure

  freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.5', '15.1']
        shared: ['OFF', 'ON']
    name: freebsd ${{ matrix.release }} (shared ${{ matrix.shared }})
    steps:
    - name: checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: build and test
      uses: vmactions/freebsd-vm@v1
      with:
        release: ${{ matrix.release }}
        usesh: true
        prepare: pkg install -y cmake ninja libfmt yaml-cpp googletest
        run: |
          set -e
          cmake -S . -B build -G Ninja -DPACKAGE_MANAGER=none -DBUILD_TESTS=ON -DEXAMPLES=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure

  openbsd:
    runs-on: ubuntu-latest
    name: openbsd 7.8 (shared OFF)
    steps:
    - name: checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: build and test
      uses: vmactions/openbsd-vm@v1
      with:
        release: '7.8'
        usesh: true
        prepare: pkg_add -I cmake ninja fmt yaml-cpp gtest
        run: |
          set -e
          cmake -S . -B build -G Ninja -DPACKAGE_MANAGER=none -DBUILD_TESTS=ON -DEXAMPLES=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure

  netbsd:
    runs-on: ubuntu-latest
    name: netbsd 10.1 (shared OFF)
    steps:
    - name: checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: build and test
      uses: vmactions/netbsd-vm@v1
      with:
        release: '10.1'
        usesh: true
        prepare: /usr/sbin/pkg_add pkgin && pkgin -y install cmake ninja-build fmtlib yaml-cpp googletest gcc13
        run: |
          set -e
          export CC=/usr/pkg/gcc13/bin/gcc CXX=/usr/pkg/gcc13/bin/g++
          cmake -S . -B build -G Ninja -DPACKAGE_MANAGER=none -DBUILD_TESTS=ON -DEXAMPLES=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure

  dragonflybsd:
    runs-on: ubuntu-latest
    name: dragonflybsd 6.4.2 (shared OFF)
    steps:
    - name: checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: build and test
      uses: vmactions/dragonflybsd-vm@v1
      with:
        release: '6.4.2'
        usesh: true
        prepare: pkg install -y cmake ninja libfmt yaml-cpp googletest
        run: |
          set -e
          cmake -S . -B build -G Ninja -DPACKAGE_MANAGER=none -DBUILD_TESTS=ON -DEXAMPLES=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
